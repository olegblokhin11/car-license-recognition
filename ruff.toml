line-length = 100
target-version = "py310"

exclude = [
    ".git",
    ".venv",
    ".ruff_cache",
    ".pytest_cache",
    "data",
    "datasets",
    "dataset_for_yolo",
    "dataset_for_yolo_extended",
    "dataset_for_yolo_extended_v2",
    "runs",
    "out",
    "assets",
    "weights",
    "checkpoints",
]

[lint]
# Явный список правил, чтобы результат не менялся при обновлении ruff.
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "RUF", # ruff-specific
]
ignore = [
    # RUF001-003 ищут визуально неоднозначные Unicode-символы (кириллические
    # «с», «о», «е» похожи на латинские) — для русскоязычного проекта это шум.
    "RUF001",
    "RUF002",
    "RUF003",
]

[format]
quote-style = "double"
indent-style = "space"
docstring-code-format = false
