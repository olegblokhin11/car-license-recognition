[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "car-license-recognition"
version = "0.1.0"
description = "Пайплайн детекции и распознавания автомобильных номеров (Гонконг/Китай/Макао)"
keywords = [
    "license-plate",
    "license-plate-recognition",
    "ocr",
    "object-detection",
    "yolo",
    "hong-kong",
    "china",
    "macau",
    "parking",
]
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy",
    "pandas",
    "opencv-python-headless",
    "pillow",
]

[project.optional-dependencies]
ocr = ["fast-plate-ocr[onnx]"]
detection = ["ultralytics"]
autolabel = ["transformers", "accelerate"]
dev = ["pytest"]

[tool.setuptools]
packages = { find = { where = ["src"] } }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]